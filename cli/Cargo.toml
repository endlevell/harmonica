[package]
name = "harmonica"
version = "0.1.0"
edition = "2021"
description = "Control CLI for the Harmonica quickshell island"

[dependencies]
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.9", features = ["lua54", "vendored"] }

[profile.release]
opt-level = 2
lto = true
strip = true
